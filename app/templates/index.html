<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Logo</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>

<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="bubble-particles" id="bubbleParticles" aria-hidden="true"></div>

  <main class="container d-flex justify-content-center align-items-center min-vh-100">
    <section class="logo-wrap" aria-label="Menú principal">
      <div class="menu-cluster" id="menuCluster">

        <div class="logo-orb" id="logoOrb" role="button" tabindex="0" aria-label="Abrir o cerrar opciones"
          aria-expanded="false">
          <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="logo-img" />
        </div>

        <a class="mini-orb-shell opt1" href="#" id="opt1">
          <span class="mini-orb">
            <span>Recomendador Personal</span>
          </span>
        </a>

        <a class="mini-orb-shell opt2" href="#" id="opt2">
          <span class="mini-orb">
            <span>Explorador de Juegos</span>
          </span>
        </a>

        <a class="mini-orb-shell opt3" href="#" id="opt3">
          <span class="mini-orb">
            <span>Steam Wrapped</span>
          </span>
        </a>

      </div>
    </section>
  </main>

  <script>
    window.APP_ROUTES = {
      opcion1: "{{ url_for('web.recomendador') }}",
      opcion2: "{{ url_for('web.explorador')}}",
      opcion3: "{{ url_for('web.wrapped')}}"
    };
  </script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
