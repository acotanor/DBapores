<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wrapped · Recomendador Steam</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />

</head>

<body class="option1-page">
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="option1-stage container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <section class="form-orb-panel" aria-label="Formulario Steam Wrapped">
      <div class="form-orb-inner">
        <div class="form-header">
          <div>
            <p class="form-kicker mb-2">Wrapped</p>
            <h1 class="form-title mb-2">Generar tu Steam Wrapped</h1>
            <p class="form-subtitle mb-0">Introduce tu SteamID y verás un resumen con tus tags, juegos más jugados y
              recomendaciones.</p>
          </div>

          <a href="{{ url_for('web.home') }}" class="back-link">Volver</a>
        </div>

        <form id="wrappedForm" novalidate>
          <div class="mb-3">
            <label for="steamId" class="form-label custom-label">Steam ID</label>
            <input type="text" class="form-control custom-input" id="steamId" placeholder="Ej: 76561199116601828"
              inputmode="numeric" autocomplete="off" required />
            <div class="input-help mt-2">El perfil y la lista de juegos deben ser públicos.</div>
          </div>

          <div class="d-flex flex-wrap gap-2 mt-4">
            <button type="submit" class="btn btn-primary custom-btn" id="submitBtn">Ver Wrapped</button>
            <button type="button" class="btn btn-outline-light custom-btn ghost-btn" id="demoBtn">Probar con
              demo</button>
          </div>

          <div id="errorState" class="status-box error-box d-none mt-4"></div>
        </form>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/wrapped_input.js') }}"></script>
</body>

</html>
